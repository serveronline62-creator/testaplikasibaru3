<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KUB App — Sistem Informasi Kelompok Umat Basis</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛪</text></svg>" />
<style>
  body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  .fade-in { animation: fadeIn .25s ease-in; }
  @keyframes fadeIn { from { opacity:0; transform: translateY(6px) } to { opacity:1; transform:none } }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  .modal-mask { background: rgba(15,23,42,.55); backdrop-filter: blur(2px); }
</style>
</head>
<body class="bg-gray-100 text-gray-800">

<!-- ==================== LOGIN ==================== -->
<div id="loginScreen" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-600 via-indigo-600 to-purple-700 p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">
    <div class="text-center mb-6">
      <div class="text-5xl mb-2">⛪</div>
      <h1 class="text-2xl font-bold text-blue-700">KUB App</h1>
      <p class="text-sm text-gray-500">Sistem Informasi Kelompok Umat Basis</p>
    </div>
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="text-sm font-medium">Email</label>
        <input type="email" id="loginEmail" required value="admin@kub.id"
          class="w-full mt-1 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" />
      </div>
      <div>
        <label class="text-sm font-medium">Password</label>
        <input type="password" id="loginPassword" required value="admin123"
          class="w-full mt-1 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" />
      </div>
      <div id="loginError" class="hidden text-sm text-red-600 bg-red-50 p-2 rounded"></div>
      <button type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition">
        Masuk
      </button>
      <p class="text-xs text-gray-400 text-center">Demo: admin@kub.id / admin123</p>
    </form>
  </div>
</div>

<!-- ==================== APP ==================== -->
<div id="app" class="hidden flex min-h-screen">

  <!-- SIDEBAR -->
  <aside id="sidebar" class="w-64 bg-white border-r border-gray-200 h-screen sticky top-0 flex flex-col">
    <div class="p-5 border-b">
      <div class="flex items-center gap-2">
        <span class="text-2xl">⛪</span>
        <div>
          <h1 class="font-bold text-lg text-blue-700 leading-none">KUB App</h1>
          <p class="text-[10px] text-gray-500 mt-1">Kelompok Umat Basis</p>
        </div>
      </div>
    </div>
    <nav id="navMenu" class="flex-1 overflow-y-auto p-3 space-y-1"></nav>
    <div class="p-3 border-t">
      <div class="flex items-center gap-3 p-2 rounded-lg bg-gray-50">
        <div class="w-9 h-9 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold" id="userAvatar">A</div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-medium truncate" id="userName">Admin</p>
          <p class="text-xs text-gray-500 truncate" id="userRole">Admin Paroki</p>
        </div>
      </div>
      <button onclick="logout()" class="w-full mt-2 text-sm text-red-600 hover:bg-red-50 py-2 rounded-lg transition">
        🚪 Keluar
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="flex-1 flex flex-col min-w-0">
    <header class="bg-white border-b border-gray-200 h-16 flex items-center justify-between px-6 sticky top-0 z-30">
      <div class="flex items-center gap-3">
        <button onclick="toggleSidebar()" class="md:hidden text-gray-500 hover:text-gray-800">
          <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <h2 id="pageTitle" class="text-lg font-semibold">Dashboard</h2>
      </div>
      <div class="flex items-center gap-3">
        <span id="clock" class="text-sm text-gray-500 hidden sm:block"></span>
      </div>
    </header>
    <main id="content" class="flex-1 p-6 overflow-y-auto"></main>
  </div>
</div>

<!-- ==================== MODAL ROOT ==================== -->
<div id="modalRoot" class="hidden fixed inset-0 z-50 modal-mask flex items-center justify-center p-4"></div>

<!-- ==================== TOAST ==================== -->
<div id="toastRoot" class="fixed top-4 right-4 z-[60] space-y-2"></div>

<script>
/* ============================================================
   STORAGE LAYER (localStorage sebagai database)
   ============================================================ */
const DB_KEY = 'kub_app_db_v1';
const SESSION_KEY = 'kub_app_session';

const defaultDB = {
  users: [
    { id: 'u1', nama: 'Admin Paroki', email: 'admin@kub.id', password: 'admin123', role: 'admin_paroki', kub_id: null }
  ],
  kub: [
    { id: 'k1', kode: 'KUB-01', nama: 'KUB St. Yosef', wilayah: 'RW 01', alamat: 'Jl. Melati No. 1', ketua: 'Bpk. Anton', jumlah_kk: 0 }
  ],
  keluarga: [
    { id: 'kk1', kub_id: 'k1', no_kk: '3201010101010001', kepala_keluarga: 'Bpk. Anton Wijaya', alamat: 'Jl. Melati No. 1', telepon: '081234567890', kategori: 'lengkap' },
    { id: 'kk2', kub_id: 'k1', no_kk: '3201010101010002', kepala_keluarga: 'Bpk. Budi Santoso', alamat: 'Jl. Melati No. 2', telepon: '081234567891', kategori: 'lengkap' }
  ],
  umat: [
    { id: 'um1', keluarga_id: 'kk1', nama_lengkap: 'Anton Wijaya', jenis_kelamin: 'L', tanggal_lahir: '1975-05-10', status_hubungan: 'kepala', telepon: '081234567890', pekerjaan: 'Karyawan' },
    { id: 'um2', keluarga_id: 'kk1', nama_lengkap: 'Maria Wijaya', jenis_kelamin: 'P', tanggal_lahir: '1978-03-15', status_hubungan: 'istri', telepon: '-', pekerjaan: 'Ibu Rumah Tangga' },
    { id: 'um3', keluarga_id: 'kk1', nama_lengkap: 'Yohanes Wijaya', jenis_kelamin: 'L', tanggal_lahir: '2005-08-20', status_hubungan: 'anak', telepon: '-', pekerjaan: 'Pelajar' },
    { id: 'um4', keluarga_id: 'kk2', nama_lengkap: 'Budi Santoso', jenis_kelamin: 'L', tanggal_lahir: '1980-01-01', status_hubungan: 'kepala', telepon: '081234567891', pekerjaan: 'Wiraswasta' }
  ],
  kegiatan: [
    { id: 'kg1', kub_id: 'k1', judul: 'Doa Rosario Lingkungan', jenis: 'doa_rosario', tanggal: todayStr(), waktu_mulai: '19:00', lokasi: 'Rumah Bpk. Anton', tuan_rumah: 'Bpk. Anton', agenda: 'Doa rosario bersama', status: 'rencana' }
  ],
  presensi: [],
  iuran: [],
  kas: [
    { id: 'tr1', kub_id: 'k1', tanggal: todayStr(), jenis: 'masuk', kategori: 'donasi', jumlah: 500000, keterangan: 'Donasi awal kas KUB' }
  ],
  pengumuman: [
    { id: 'pg1', kub_id: 'k1', judul: 'Selamat Datang di KUB App', isi: 'Aplikasi ini digunakan untuk mengelola data KUB.', target: 'kub', penting: true, created_at: new Date().toISOString() }
  ],
  dokumen: [],
  jadwal: []
};

function todayStr() { return new Date().toISOString().slice(0,10); }

function loadDB() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (!raw) { localStorage.setItem(DB_KEY, JSON.stringify(defaultDB)); return structuredClone(defaultDB); }
    return JSON.parse(raw);
  } catch { return structuredClone(defaultDB); }
}
function saveDB() { localStorage.setItem(DB_KEY, JSON.stringify(DB)); }
function uid(prefix='id') { return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

let DB = loadDB();
let SESSION = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');

/* ============================================================
   UI HELPERS
   ============================================================ */
function toast(msg, type='success') {
  const colors = {
    success: 'bg-green-600', error: 'bg-red-600',
    info: 'bg-blue-600', warning: 'bg-yellow-500'
  };
  const el = document.createElement('div');
  el.className = `${colors[type]} text-white px-4 py-2.5 rounded-lg shadow-lg text-sm fade-in`;
  el.textContent = msg;
  document.getElementById('toastRoot').appendChild(el);
  setTimeout(() => { el.style.opacity = 0; setTimeout(() => el.remove(), 300); }, 2800);
}

function openModal(html, maxW='max-w-2xl') {
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="bg-white rounded-2xl shadow-2xl w-full ${maxW} max-h-[90vh] overflow-y-auto fade-in">${html}</div>`;
  root.classList.remove('hidden');
  root.onclick = (e) => { if (e.target === root) closeModal(); };
}
function closeModal() {
  document.getElementById('modalRoot').classList.add('hidden');
  document.getElementById('modalRoot').innerHTML = '';
}

function fmtRp(n) { return 'Rp ' + Number(n||0).toLocaleString('id-ID'); }
function fmtDate(d) {
  if (!d) return '-';
  try { return new Date(d).toLocaleDateString('id-ID', { day:'2-digit', month:'short', year:'numeric' }); }
  catch { return d; }
}
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================================================
   ROUTER / MENU
   ============================================================ */
const MENU = [
  { id: 'dashboard', label: 'Dashboard',     icon: '📊' },
  { id: 'kub',       label: 'Data KUB',      icon: '🏠' },
  { id: 'keluarga',  label: 'Keluarga',      icon: '👨‍👩‍👧' },
  { id: 'umat',      label: 'Umat',          icon: '👥' },
  { id: 'kegiatan',  label: 'Kegiatan',      icon: '📅' },
  { id: 'presensi',  label: 'Presensi',      icon: '✅' },
  { id: 'iuran',     label: 'Iuran',         icon: '💰' },
  { id: 'kas',       label: 'Kas',           icon: '💵' },
  { id: 'jadwal',    label: 'Jadwal Petugas',icon: '📋' },
  { id: 'pengumuman',label: 'Pengumuman',    icon: '📢' },
  { id: 'dokumen',   label: 'Dokumen',       icon: '📁' },
  { id: 'laporan',   label: 'Laporan',       icon: '📈' },
  { id: 'pengaturan',label: 'Pengaturan',    icon: '⚙️' },
];

let currentPage = 'dashboard';

function renderMenu() {
  document.getElementById('navMenu').innerHTML = MENU.map(m => `
    <a onclick="go('${m.id}')" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium cursor-pointer transition ${
      currentPage === m.id ? 'bg-blue-50 text-blue-700' : 'text-gray-700 hover:bg-gray-100'
    }">
      <span class="text-base">${m.icon}</span> ${m.label}
    </a>
  `).join('');
}

function go(page) {
  currentPage = page;
  renderMenu();
  document.getElementById('pageTitle').textContent = MENU.find(m => m.id === page)?.label || 'Dashboard';
  const content = document.getElementById('content');
  content.classList.remove('fade-in'); void content.offsetWidth; content.classList.add('fade-in');
  const map = {
    dashboard: pageDashboard, kub: pageKub, keluarga: pageKeluarga, umat: pageUmat,
    kegiatan: pageKegiatan, presensi: pagePresensi, iuran: pageIuran, kas: pageKas,
    jadwal: pageJadwal, pengumuman: pagePengumuman, dokumen: pageDokumen,
    laporan: pageLaporan, pengaturan: pagePengaturan
  };
  (map[page] || pageDashboard)(content);
}

function toggleSidebar() {
  const s = document.getElementById('sidebar');
  s.classList.toggle('hidden');
  s.classList.toggle('absolute');
  s.classList.toggle('z-40');
}

/* ============================================================
   AUTH
   ============================================================ */
document.getElementById('loginForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPassword').value;
  const user = DB.users.find(u => u.email === email && u.password === pass);
  const errEl = document.getElementById('loginError');
  if (!user) {
    errEl.textContent = 'Email atau password salah.';
    errEl.classList.remove('hidden');
    return;
  }
  SESSION = { user_id: user.id, ts: Date.now() };
  localStorage.setItem(SESSION_KEY, JSON.stringify(SESSION));
  showApp();
});

function logout() {
  localStorage.removeItem(SESSION_KEY);
  SESSION = null;
  location.reload();
}

function showApp() {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  const u = DB.users.find(x => x.id === SESSION.user_id) || DB.users[0];
  document.getElementById('userName').textContent = u.nama;
  document.getElementById('userRole').textContent = u.role.replace('_',' ');
  document.getElementById('userAvatar').textContent = u.nama.charAt(0).toUpperCase();
  renderMenu();
  go('dashboard');
}

/* ============================================================
   PAGE: DASHBOARD
   ============================================================ */
function pageDashboard(el) {
  const totalKeluarga = DB.keluarga.length;
  const totalUmat = DB.umat.length;
  const kegiatanAktif = DB.kegiatan.filter(k => k.status !== 'selesai').length;
  const masuk = DB.kas.filter(t => t.jenis==='masuk').reduce((a,t)=>a+Number(t.jumlah),0);
  const keluar = DB.kas.filter(t => t.jenis==='keluar').reduce((a,t)=>a+Number(t.jumlah),0);
  const saldo = masuk - keluar;

  const laki = DB.umat.filter(u => u.jenis_kelamin==='L').length;
  const perempuan = DB.umat.filter(u => u.jenis_kelamin==='P').length;

  el.innerHTML = `
    <div class="grid md:grid-cols-4 gap-4 mb-6">
      ${statCard('👨‍👩‍👧','Total Keluarga', totalKeluarga, 'bg-blue-500')}
      ${statCard('👥','Total Umat', totalUmat, 'bg-green-500')}
      ${statCard('📅','Kegiatan Aktif', kegiatanAktif, 'bg-orange-500')}
      ${statCard('💵','Saldo Kas', fmtRp(saldo), 'bg-purple-500')}
    </div>

    <div class="grid md:grid-cols-3 gap-4 mb-6">
      <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100 md:col-span-2">
        <h3 class="font-semibold mb-4">Statistik Umat per Keluarga</h3>
        <canvas id="chartKeluarga" height="90"></canvas>
      </div>
      <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
        <h3 class="font-semibold mb-4">Komposisi Umat</h3>
        <canvas id="chartGender" height="180"></canvas>
        <div class="mt-4 text-sm space-y-1">
          <div class="flex justify-between"><span>👨 Laki-laki</span><b>${laki}</b></div>
          <div class="flex justify-between"><span>👩 Perempuan</span><b>${perempuan}</b></div>
        </div>
      </div>
    </div>

    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
        <h3 class="font-semibold mb-3">📅 Kegiatan Terdekat</h3>
        <ul class="space-y-2 text-sm">
          ${DB.kegiatan.slice(0,5).map(k=>`
            <li class="flex justify-between border-l-2 border-blue-500 pl-3">
              <span>${esc(k.judul)}</span>
              <span class="text-gray-500">${fmtDate(k.tanggal)}</span>
            </li>`).join('') || '<li class="text-gray-400">Belum ada kegiatan</li>'}
        </ul>
      </div>
      <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
        <h3 class="font-semibold mb-3">📢 Pengumuman Terbaru</h3>
        <ul class="space-y-2 text-sm">
          ${DB.pengumuman.slice(0,5).map(p=>`
            <li class="border-l-2 ${p.penting?'border-red-500':'border-gray-300'} pl-3">
              <b>${esc(p.judul)}</b>
              <p class="text-gray-500 text-xs line-clamp-2">${esc(p.isi)}</p>
            </li>`).join('') || '<li class="text-gray-400">Belum ada pengumuman</li>'}
        </ul>
      </div>
    </div>
  `;

  // Chart: umat per keluarga
  const labels = DB.keluarga.map(k => k.kepala_keluarga);
  const dataKK = DB.keluarga.map(k => DB.umat.filter(u => u.keluarga_id === k.id).length);
  new Chart(document.getElementById('chartKeluarga'), {
    type: 'bar',
    data: { labels, datasets: [{ label: 'Jumlah Anggota', data: dataKK, backgroundColor: '#3b82f6', borderRadius: 6 }] },
    options: { plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true, ticks:{precision:0}}} }
  });

  new Chart(document.getElementById('chartGender'), {
    type: 'doughnut',
    data: { labels:['Laki-laki','Perempuan'], datasets:[{ data:[laki, perempuan], backgroundColor:['#3b82f6','#ec4899'] }] },
    options: { plugins:{legend:{position:'bottom'}} }
  });
}

function statCard(icon, label, value, color) {
  return `
    <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100 flex items-center gap-4">
      <div class="w-12 h-12 rounded-xl ${color} text-white flex items-center justify-center text-xl">${icon}</div>
      <div>
        <p class="text-sm text-gray-500">${label}</p>
        <p class="text-xl font-bold">${value}</p>
      </div>
    </div>`;
}

/* ============================================================
   PAGE: KUB
   ============================================================ */
function pageKub(el) {
  el.innerHTML = `
    <div class="flex justify-between items-center mb-4">
      <p class="text-gray-500 text-sm">Total: ${DB.kub.length} KUB</p>
      <button onclick="formKub()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm">+ Tambah KUB</button>
    </div>
    <div class="grid md:grid-cols-3 gap-4">
      ${DB.kub.map(k => `
        <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
          <div class="flex justify-between items-start mb-2">
            <span class="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded">${esc(k.kode)}</span>
          </div>
          <h3 class="font-semibold text-lg">${esc(k.nama)}</h3>
          <p class="text-sm text-gray-500">${esc(k.wilayah||'-')}</p>
          <p class="text-sm text-gray-500">${esc(k.alamat||'-')}</p>
          <div class="mt-3 pt-3 border-t flex items-center justify-between text-sm">
            <span>👨‍👩‍👧 ${DB.keluarga.filter(x=>x.kub_id===k.id).length} KK</span>
            <span>👥 ${DB.umat.filter(u => DB.keluarga.filter(x=>x.kub_id===k.id).map(x=>x.id).includes(u.keluarga_id)).length} umat</span>
          </div>
          <div class="mt-3 flex gap-2">
            <button onclick="formKub('${k.id}')" class="text-blue-600 text-sm hover:underline">Edit</button>
            <button onclick="hapusKub('${k.id}')" class="text-red-600 text-sm hover:underline">Hapus</button>
          </div>
        </div>
      `).join('') || '<p class="text-gray-400">Belum ada KUB</p>'}
    </div>
  `;
}

function formKub(id) {
  const k = id ? DB.kub.find(x=>x.id===id) : { kode:'', nama:'', wilayah:'', alamat:'', ketua:'' };
  openModal(`
    <div class="p-6">
      <h2 class="text-xl font-bold mb-4">${id?'Edit':'Tambah'} KUB</h2>
      <form onsubmit="simpanKub(event,'${id||''}')" class="space-y-3">
        <div class="grid grid-cols-2 gap-3">
          <div><label class="text-sm">Kode</label><input name="kode" required value="${esc(k.kode)}" class="w-full px-3 py-2 border rounded-lg"/></div>
          <div><label class="text-sm">Nama</label><input name="nama" required value="${esc(k.nama)}" class="w-full px-3 py-2 border rounded-lg"/></div>
          <div><label class="text-sm">Wilayah</label><input name="wilayah" value="${esc(k.wilayah||'')}" class="w-full px-3 py-2 border rounded-lg"/></div>
          <div><label class="text-sm">Ketua</label><input name="ketua" value="${esc(k.ketua||'')}" class="w-full px-3 py-2 border rounded-lg"/></div>
        </div>
        <div><label class="text-sm">Alamat</label><textarea name="alamat" rows="2" class="w-full px-3 py-2 border rounded-lg">${esc(k.alamat||'')}</textarea></div>
        <div class="flex gap-2 pt-2">
          <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg">Simpan</button>
          <button type="button" onclick="closeModal()" class="bg-gray-200 px-4 py-2 rounded-lg">Batal</button>
        </div>
      </form>
    </div>
  `);
}

function simpanKub(e, id) {
  e.preventDefault();
  const f = new FormData(e.target);
  const data = Object.fromEntries(f);
  if (id) {
    Object.assign(DB.kub.find(x=>x.id===id), data);
  } else {
    DB.kub.push({ id: uid('k'), ...data });
  }
  saveDB(); closeModal(); toast('KUB tersimpan'); go('kub');
}

function hapusKub(id) {
  if (!confirm('Hapus KUB ini?')) return;
  DB.kub = DB.kub.filter(x=>x.id!==id);
  saveDB(); toast('KUB dihapus','info'); go('kub');
}

/* ============================================================
   PAGE: KELUARGA
   ============================================================ */
function pageKeluarga(el) {
  el.innerHTML = `
    <div class="flex justify-between items-center mb-4">
      <p class="text-gray-500 text-sm">Total: ${DB.keluarga.length} keluarga</p>
      <button onclick="formKeluarga()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm">+ Tambah Keluarga</button>
    </div>
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 text-gray-500 text-left">
          <tr>
            <th class="px-4 py-3">No. KK</th>
            <th class="px-4 py-3">Kepala Keluarga</th>

function presensiKegiatan(kegiatanId) {
  const kg = DB.kegiatan.find(k => k.id === kegiatanId);
  if (!kg) return;
  const umatList = DB.umat;
  const getStatus = (uid) => DB.presensi.find(p => p.kegiatan_id===kegiatanId && p.umat_id===uid)?.status || 'alpa';

  openModal(`
    <div class="p-6">
      <h2 class="text-xl font-bold mb-1">Presensi</h2>
      <p class="text-sm text-gray-500 mb-4">${esc(kg.judul)} — ${fmtDate(kg.tanggal)}</p>
      <div class="max-h-[60vh] overflow-y-auto border rounded-lg">

          <thead class="bg-gray-50 sticky top-0">
            <tr><th class="text-left px-3 py-2">Nama</th><th class="text-right px-3 py-2">Status</th></tr>
          </thead>
          <tbody>
            ${umatList.map(u => `
              <tr class="border-t">
                <td class="px-3 py-2">${esc(u.nama_lengkap)}</td>
                <td class="px-3 py-2 text-right">
                  <select onchange="setPresensi('${kegiatanId}','${u.id}',this.value)"
                    class="text-xs px-2 py-1 border rounded">
                    ${['hadir','izin','sakit','alpa'].map(s=>`<option value="${s}" ${getStatus(u.id)===s?'selected':''}>${s}</option>`).join('')}
                  </select>
                </td>
              </tr>
            `).join('') || '<tr><td colspan="2" class="p-4 text-center text-gray-400">Belum ada umat</td></tr>'}
          </tbody>
        </table>
      </div>
      <div class="flex gap-2 pt-4">
        <button onclick="closeModal();go('kegiatan')" class="bg-blue-600 text-white px-4 py-2 rounded-lg">Selesai</button>
      </div>
    </div>
  `, 'max-w-xl');
}

function setPresensi(kegiatanId, umatId, status) {
  const existing = DB.presensi.find(p => p.kegiatan_id===kegiatanId && p.umat_id===umatId);
  if (existing) existing.status = status;
  else DB.presensi.push({ id: uid('pr'), kegiatan_id: kegiatanId, umat_id: umatId, status });
  saveDB();
}

    months[m][t.jenis] += Number(t.jumlah);
  });
  const labels = Object.keys(months).sort();
  new Chart(document.getElementById('chartKeuangan'), {
    type: 'line',
    data: {
      labels,
      datasets: [
        { label:'Masuk', data: labels.map(l => months[l].masuk), borderColor:'#16a34a', backgroundColor:'rgba(22,163,74,.1)', tension:.3 },

}

function exportLaporanCSV() {
  const rows = [
    ['LAPORAN KUB'],
    ['Tanggal Export', new Date().toLocaleString('id-ID')],
    [],
    ['Statistik'],
    ['Total Keluarga', DB.keluarga.length],
    ['Total Umat', DB.umat.length],
    ['Total Kegiatan', DB.kegiatan.length],
    [],
    ['Transaksi Kas'],
    ['Tanggal','Kategori','Keterangan','Jenis','Jumlah'],
    ...DB.kas.map(t => [t.tanggal, t.kategori, t.keterangan, t.jenis, t.jumlah]),
  ];
  const csv = rows.map(r => r.map(c => `"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `laporan-kub-${todayStr()}.csv`;
  a.click();
  toast('Laporan CSV diunduh');
}

        <div class="flex flex-wrap gap-2">
          <button onclick="exportData()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm">📥 Export JSON</button>
          <label class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm cursor-pointer">
            📤 Import JSON
            <input type="file" accept=".json" onchange="importData(event)" class="hidden"/>
          </label>
          <button onclick="resetData()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm">⚠️ Reset Data</button>
        </div>
      </div>

      <div class="bg-white rounded-xl p-5 shadow-sm border md:col-span-2">
        <h3 class="font-semibold mb-3">ℹ️ Tentang Aplikasi</h3>
        <p class="text-sm text-gray-600">
          <b>KUB App</b> — Sistem Informasi Kelompok Umat Basis v1.0<br/>
          Aplikasi single-file HTML untuk mengelola data KUB: keluarga, umat, kegiatan, presensi, iuran, kas, jadwal petugas, pengumuman, dan laporan.
          Data disimpan secara lokal di browser Anda. Untuk penggunaan multi-user & multi-paroki, migrasikan ke backend (Supabase/MySQL + Next.js).
        </p>
      </div>
    </div>
  `;
}

function simpanProfil(e) {
  e.preventDefault();
  const f = new FormData(e.target);
  DB.users[0].nama = f.get('nama');
  DB.users[0].email = f.get('email');
  if (f.get('password')) DB.users[0].password = f.get('password');
  saveDB(); toast('Profil tersimpan');
  document.getElementById('userName').textContent = DB.users[0].nama;
  document.getElementById('userAvatar').textContent = DB.users[0].nama.charAt(0).toUpperCase();
}

function exportData() {
  const blob = new Blob([JSON.stringify(DB, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `kub-backup-${todayStr()}.json`;
  a.click();
  toast('Backup diunduh');
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (!data.users || !data.kub) throw new Error('Format tidak valid');
      DB = data; saveDB(); toast('Data berhasil diimport'); location.reload();
    } catch (err) { toast('File tidak valid: ' + err.message, 'error'); }
  };
  r.readAsText(file);
}

function resetData() {
  if (!confirm('Yakin reset semua data? Data akan kembali ke awal.')) return;
  localStorage.removeItem(DB_KEY);
  localStorage.removeItem(SESSION_KEY);
  location.reload();
}

function updateClock() {
  const el = document.getElementById('clock');
  if (el) el.textContent = new Date().toLocaleString('id-ID', {
    weekday:'long', day:'2-digit', month:'long', year:'numeric'
  });
}
setInterval(updateClock, 1000); updateClock();

if (SESSION) {
  showApp();
} else {
  document.getElementById('loginScreen').classList.remove('hidden');
}

// expose ke global (untuk onclick di HTML)
Object.assign(window, {
  go, logout, toggleSidebar, closeModal, openModal,
  formKub, simpanKub, hapusKub,
  formKeluarga, simpanKeluarga, hapusKeluarga,
  formUmat, simpanUmat, hapusUmat, renderUmatTable,
  formKegiatan, simpanKegiatan, hapusKegiatan,
  presensiKegiatan, setPresensi,
  formIuran, simpanIuran, hapusIuran,
  formKas, simpanKas, hapusKas,
  formJadwal, simpanJadwal, hapusJadwal,
  formPengumuman, simpanPengumuman, hapusPengumuman,
  formDokumen, simpanDokumen, hapusDokumen,
  exportLaporanCSV, simpanProfil, exportData, importData, resetData,
});
